<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MemoryChain | Upload Memory</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Navigation -->
<div class="navbar">

    <div class="logo">
        🧠 MemoryChain
    </div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="upload.html">Upload</a>
        <a href="view_memories.html">Memories</a>
        <a href="verify.html">Verify</a>
        <a href="login.html">Logout</a>
    </div>

</div>


<!-- Upload Section -->
<div class="container">

    <div style="text-align:center;">

        <div class="brand">

            <div class="brand-icon">📤</div>

            <div>
                <h1>Upload Memory</h1>
                <span>Securely add a new memory</span>
            </div>

        </div>

        <p style="color:#cbd5e1;">
            Add your memory and securely record its hash
            for future verification.
        </p>

    </div>


    <br>


    <!-- Memory Title -->
    <label for="title">Memory Title</label>

    <input
        type="text"
        id="title"
        placeholder="Enter Memory Title"
    >


    <!-- Description -->
    <label for="description">Memory Description</label>

    <textarea
        id="description"
        placeholder="Enter Memory Description"
        rows="5"
    ></textarea>


    <!-- File -->
    <label for="file">Select File</label>

    <input
        type="file"
        id="file"
    >


    <br><br>


    <!-- Upload Button -->
    <div style="text-align:center;">

        <button onclick="uploadMemory()">
            🔐 Upload to Blockchain
        </button>

    </div>


    <br>


    <!-- Status -->
    <div id="status"></div>


    <br>


    <!-- Back -->
    <div style="text-align:center;">

        <button onclick="window.location.href='dashboard.html'">
            ← Back to Dashboard
        </button>

    </div>

</div>


<script src="upload.js"></script>

</body>

</html>

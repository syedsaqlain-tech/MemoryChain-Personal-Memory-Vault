<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MemoryChain | My Memories</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Navigation -->
<div class="navbar">

    <div class="logo">
        🧠 MemoryChain
    </div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="upload.html">Upload</a>
        <a href="view_memories.html">Memories</a>
        <a href="verify.html">Verify</a>
        <a href="login.html">Logout</a>
    </div>

</div>


<!-- Memories -->
<div class="container">

    <div style="text-align:center;">

        <div class="brand">

            <div class="brand-icon">📂</div>

            <div>
                <h1>My Memories</h1>
                <span>Personal Memory Vault</span>
            </div>

        </div>

        <p style="color:#cbd5e1;">
            View and manage your securely stored memories.
        </p>

    </div>


    <br>


    <!-- Search -->
    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search Memory..."
        onkeyup="searchMemory()"
    >


    <br><br>


    <!-- Memory Table -->
    <div style="overflow-x:auto;">

        <table id="memoryTable">

            <thead>

                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>File</th>
                    <th>Blockchain</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="tableBody">
            </tbody>

        </table>

    </div>


    <br><br>


    <!-- Back -->
    <div style="text-align:center;">

        <button onclick="window.location.href='dashboard.html'">
            ← Dashboard
        </button>

    </div>

</div>


<script src="view.js"></script>

</body>

</html>
